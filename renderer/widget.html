<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
<title>메모 위젯</title>
<link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div id="widget">
    <div id="panel" class="panel">
      <div id="dragHandle" class="drag-handle" title="드래그해서 위치 이동">⋮⋮</div>
      <div class="panel-header">
        <span id="panelColorDot" class="color-dot"></span>
        <input id="panelTitleInput" class="panel-title-input" maxlength="60" placeholder="제목" />
        <button id="pinBtn" class="pin-btn" title="고정하면 마우스를 떼도 닫히지 않습니다">📌</button>
      </div>
      <div id="panelPageList" class="panel-page-list"></div>
      <div id="panelBodyInput" class="panel-body-input" contenteditable="true" data-placeholder="내용을 입력하세요..."></div>
      <div class="panel-footer">
        <div class="panel-mini-toolbar">
          <button id="panelBulletBtn" class="mini-btn" title="글머리 기호 (Ctrl+Shift+8)">•</button>
          <button id="panelItalicBtn" class="mini-btn" title="기울임 (Ctrl+I)"><i>I</i></button>
          <select id="panelFontSelect" class="mini-select" title="글꼴">
            <option value="">글꼴</option>
            <option value="Malgun Gothic">맑은 고딕</option>
            <option value="Gungsuh">궁서</option>
            <option value="Batang">바탕</option>
          </select>
        </div>
        <span id="panelSaveStatus" class="panel-save-status"></span>
        <button id="panelDeleteBtn" class="panel-btn panel-btn-danger" title="이 폴더 삭제">🗑</button>
        <button id="panelEditBtn" class="panel-btn">전체 편집 열기</button>
      </div>
    </div>
    <div id="schedPanel" class="panel sched-panel">
      <div id="schedDragHandle" class="drag-handle" title="드래그해서 위치 이동">⋮⋮</div>
      <div class="panel-header">
        <span class="sched-title">📅 일정</span>
        <span id="schedToday" class="sched-today"></span>
        <button id="schedPinBtn" class="pin-btn" title="고정하면 마우스를 떼도 닫히지 않습니다">📌</button>
      </div>
      <div id="schedList" class="sched-list"></div>
      <form id="quickAdd" class="quick-add" autocomplete="off">
        <input id="qaTitle" class="qa-title" maxlength="120" placeholder="예: 내일 오후 3시 팀 회의" />
        <div id="qaPreview" class="qa-preview" hidden></div>
        <div class="qa-row">
          <div id="qaDays" class="qa-days">
            <button type="button" class="qa-day on" data-off="0">오늘</button>
            <button type="button" class="qa-day" data-off="1">내일</button>
            <button type="button" class="qa-day" data-off="2">모레</button>
          </div>
          <input id="qaTime" class="qa-time" maxlength="5" placeholder="14:30" title="시간 (비우면 종일)" />
          <button id="qaAdd" type="submit" class="panel-btn qa-add">추가</button>
        </div>
      </form>
      <div class="panel-footer">
        <span id="schedStatus" class="panel-save-status"></span>
        <button id="schedOpenBtn" class="panel-btn">달력 열기</button>
      </div>
    </div>
    <div id="tabs" class="tabs"></div>
  </div>
  <script src="schedule-core.js"></script>
  <script src="shortcuts.js"></script>
  <script src="widget.js"></script>
</body>
</html>
