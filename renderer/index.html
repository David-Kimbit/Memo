<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
<title>메모함</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="app-title">📂 메모함</h1>
      <div class="topbar-actions">
        <input id="searchInput" type="text" placeholder="제목·내용 검색" />
        <button id="calcBtn" class="btn" title="계산기">🧮 계산기</button>
        <button id="newFolderBtn" class="btn primary">+ 새 폴더</button>
      </div>
    </header>

    <main id="stackView" class="stack-view">
      <div id="folderStack" class="folder-stack"></div>
      <p id="emptyHint" class="empty-hint" hidden>아직 폴더가 없습니다. "+ 새 폴더"로 시작해 보세요.</p>
    </main>

    <main id="folderView" class="folder-view" hidden>
      <div class="folder-view-header">
        <button id="backBtn" class="btn ghost">← 목록으로</button>
        <input id="folderTitleInput" class="folder-title-input" maxlength="60" />
        <div class="folder-view-actions">
          <div class="color-swatches" id="colorSwatches"></div>
          <button id="deleteFolderBtn" class="btn danger">폴더 삭제</button>
        </div>
      </div>
      <div class="folder-body">
        <aside class="page-list-panel">
          <div class="page-list-head">
            <span>페이지</span>
            <button id="addPageBtn" class="btn small">+ 추가</button>
          </div>
          <div id="pageList" class="page-list"></div>
        </aside>
        <section class="page-editor">
          <input id="pageTitleInput" class="page-title-input" maxlength="80" placeholder="페이지 제목" />

          <div id="rteToolbar" class="rte-toolbar">
            <select id="fontFamilySelect" class="rte-select" title="글꼴">
              <option value="">글꼴</option>
              <option value="Malgun Gothic">맑은 고딕</option>
              <option value="Segoe UI">Segoe UI</option>
              <option value="Georgia">Georgia</option>
              <option value="Courier New">Courier New</option>
              <option value="Comic Sans MS">Comic Sans MS</option>
            </select>
            <select id="fontSizeSelect" class="rte-select" title="글자 크기">
              <option value="">크기</option>
              <option value="2">작게</option>
              <option value="3">보통</option>
              <option value="5">크게</option>
              <option value="7">아주 크게</option>
            </select>
            <span class="rte-sep"></span>
            <button data-cmd="bold" class="rte-btn" title="굵게"><b>B</b></button>
            <button data-cmd="italic" class="rte-btn" title="기울임"><i>I</i></button>
            <button data-cmd="underline" class="rte-btn" title="밑줄"><u>U</u></button>
            <button id="clearFormatBtn" class="rte-btn" title="서식 지우기">✕</button>
            <span class="rte-sep"></span>
            <label class="rte-color-label" title="글자 색">
              가<input type="color" id="textColorInput" class="rte-color" value="#3b2f22" />
            </label>
            <label class="rte-color-label rte-highlight-label" title="형광펜">
              🖍<input type="color" id="highlightColorInput" class="rte-color" value="#fff59d" />
            </label>
            <button id="removeHighlightBtn" class="rte-btn" title="형광펜 지우기">🖍✕</button>
            <span class="rte-sep"></span>
            <button id="bulletBtn" class="rte-btn" title="글머리 기호">•</button>
            <button id="numberBtn" class="rte-btn" title="번호 매기기">1.</button>
            <select id="listStyleSelect" class="rte-select" title="번호 스타일">
              <option value="decimal">1,2,3</option>
              <option value="lower-alpha">a,b,c</option>
              <option value="upper-alpha">A,B,C</option>
              <option value="lower-roman">i,ii,iii</option>
            </select>
            <button id="checklistBtn" class="rte-btn" title="체크리스트">☑</button>
            <span class="rte-sep"></span>
            <button id="linkBtn" class="rte-btn" title="링크 삽입">🔗</button>
            <button id="imageBtn" class="rte-btn" title="사진 삽입">🖼</button>
            <button id="tableBtn" class="rte-btn" title="표 삽입">▦</button>
            <label class="rte-color-label" title="표 테두리 색 (커서를 표 안에 두고 선택)">
              ▦<input type="color" id="tableBorderColorInput" class="rte-color" value="#d9c9a8" />
            </label>
            <button id="calcSelBtn" class="rte-btn" title="선택한 숫자들의 합계·평균·곱">Σ</button>
            <button id="calcSendBtn" class="rte-btn" title="선택한 숫자를 계산기로 보내기">🧮→</button>
            <span class="rte-sep"></span>
            <button id="attachBtn" class="rte-btn" title="파일 첨부">📎 첨부</button>
          </div>
          <input type="file" id="imageFileInput" accept="image/*" hidden />
          <input type="file" id="attachmentFileInput" multiple hidden />

          <div id="attachmentList" class="attachment-list"></div>
          <div id="pageContentInput" class="page-content-input" contenteditable="true" data-placeholder="내용을 입력하세요..."></div>
          <div class="editor-footer">
            <span id="saveStatus" class="save-status"></span>
            <button id="deletePageBtn" class="btn danger small">이 페이지 삭제</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>

  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <div id="modalTitle" class="modal-title"></div>
      <input id="modalInput" class="modal-input" />
      <textarea id="modalTextarea" class="modal-textarea" readonly hidden></textarea>
      <div class="modal-actions">
        <span id="modalCopyStatus" class="modal-copy-status"></span>
        <button id="modalCopyBtn" class="btn small" hidden>복사</button>
        <button id="modalCancelBtn" class="btn ghost">취소</button>
        <button id="modalOkBtn" class="btn primary">확인</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
